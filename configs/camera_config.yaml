# Camera Configuration

camera:
  # Camera type: usb, csi, rtsp
  type: "usb"

  # USB Camera settings
  usb:
    device_id: 0
    width: 640
    height: 480
    fps: 30

  # CSI Camera settings (Raspberry Pi Camera Module)
  csi:
    width: 640
    height: 480
    fps: 30

  # RTSP Network Camera settings
  rtsp:
    url: "rtsp://admin:password@192.168.1.100:554/stream1"
    buffer_size: 1
    reconnect_delay: 5

# Performance settings
performance:
  # Use threaded camera reading for better performance
  threaded: true

  # Frame skip - process every N frames
  frame_skip: 1

  # Display output
  display: true
